name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.4.0)
        required: true
        type: string

# Serialize releases so two tap updates cannot race.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.manual_release.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.manual_release.outputs.version }}
      sha: ${{ steps.release.outputs.sha || steps.manual_release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease || steps.manual_release.outputs.prerelease }}
      ready: ${{ steps.release.outputs.ready || steps.manual_release.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'workflow_run' }}
      - name: Tag successful main build
        if: github.event_name == 'workflow_run'
        id: release
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo '::error::Set TAP_GITHUB_TOKEN before creating a release tag.'
            exit 1
          fi
          # If another merge landed while CI ran, release that newer merge instead.
          git fetch origin main --no-tags
          if [ "$(git rev-parse origin/main)" != "$CI_SHA" ]; then
            echo 'Main advanced since this CI run; a newer run will release it.'
            exit 0
          fi
          if git tag --points-at "$CI_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'This main commit already has a stable release tag.'
            exit 0
          fi
          python3 scripts/release.py next build.zig.zon $(git tag -l 'v*') > "$RUNNER_TEMP/release-outputs"
          TAG="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/release-outputs")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.zig.zon
          if ! git diff --cached --quiet; then
            git commit -m "Bump git-weight version to ${TAG#v}"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          # Push the version commit and tag together or neither; bot pushes do not
          # retrigger GitHub Actions, so this run performs the release itself.
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          cat "$RUNNER_TEMP/release-outputs" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\nready=true\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate and resolve existing tag
        if: github.event_name != 'workflow_run'
        id: manual_release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py validate "$TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Check tap credentials for stable releases
        if: (steps.release.outputs.ready == 'true' && steps.release.outputs.prerelease == 'false') || (steps.manual_release.outputs.ready == 'true' && steps.manual_release.outputs.prerelease == 'false')
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo '::error::Set TAP_GITHUB_TOKEN with Contents: read/write on kris-hansen/homebrew-git-weight. See docs/releasing.md.'
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: git-weight-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 -m unittest discover -s test -p 'test_release.py'
          python3 scripts/release.py package "$TAG" dist
          ruby -c dist/git-weight.rb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Create as a draft so users never see a partially uploaded release.
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt dist/git-weight.rb \
            --verify-tag --title "$TAG" --generate-notes --draft --prerelease="$PRERELEASE"
          gh release edit "$TAG" --draft=false

  homebrew:
    needs: [prepare, publish]
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kris-hansen/homebrew-git-weight
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Download published formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --pattern git-weight.rb --dir Formula --clobber
      - name: Update tap
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/git-weight.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "git-weight $TAG"
          git push
